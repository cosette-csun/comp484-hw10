
<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="Mochi's Giga Pet">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>This is your Giga Pet</h1>
    </header>

    <main>
      <section class="pet-image-container">
        <img class="pet-image" src="images/mochi.jpg" alt="Mochi the cat">
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <button class="nap-button">Nap</button>
        </div>

        <p id="pet-message" aria-live="polite"></p>
      </section>
    </main>

    <!-- HW10 - START ADD -->
    <section style="text-align: center; padding: 20px; clear: both;">
      <h2>HW10: DevTools Demonstration</h2>

      <p>These buttons intentionally trigger browser diagnostics.</p>

      <button onclick="triggerTypeError()">
        Trigger TypeError
      </button>

      <button onclick="triggerViolation()">
        Trigger Performance Violation
      </button>
    </section>
    <!-- HW10 - END ADD -->

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
